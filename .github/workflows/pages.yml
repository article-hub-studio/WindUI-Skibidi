name: Deploy site (GitHub Pages)

# The site is served from the gh-pages branch, and nothing kept that branch up
# to date: its last commit was pushed by hand. So the docs at
# https://article-hub-studio.github.io/WindUI-Skibidi/ went stale the moment
# someone stopped publishing manually.
#
# This builds the library, syncs the Pages assets, exports the docs and pushes
# the result to gh-pages. The export also hosts every loadstring URL
# (loader.lua, main.lua, dist/main.lua, main_example.lua,
# src/themes/Init.lua) at the paths the runtime fetches, so a stale branch
# meant a stale runtime too.
#
# Publishing to the branch keeps working with the repository's current
# "Deploy from a branch" Pages setting - no settings change required.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running publish: a half-pushed branch leaves Pages serving a
# partial site.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install Rojo, Lune and DarkLua
        run: aftman install

      - name: Install library dependencies
        run: npm install --no-audit --no-fund

      - name: Build library
        run: npm run build

      - name: Sync Pages assets
        run: npm run sync:pages

      - name: Install docs dependencies
        run: npm ci --prefix website --no-audit --no-fund

      - name: Build docs site
        # Lets getLatestVersion authenticate instead of hitting the 60 req/hour
        # unauthenticated GitHub API limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run docs:build

      - name: Verify runtime URLs are in the export
        run: |
          missing=0
          for path in loader.lua main.lua dist/main.lua main_example.lua src/themes/Init.lua index.html docs/index.html; do
            if [ ! -f "website/out/$path" ]; then
              echo "::error::website/out/$path is missing - publishing would break that URL"
              missing=1
            fi
          done
          exit $missing

      - name: Publish to gh-pages
        env:
          # Not interpolated into the shell: a commit subject from the trigger
          # would be an injection vector.
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Jekyll drops any path starting with an underscore, which is where
          # Next puts its entire asset bundle.
          touch website/out/.nojekyll

          cd website/out
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $DEPLOY_SHA"

          # The branch is build output; a single fresh commit keeps the repo
          # from carrying every past export.
          git push -f "https://x-access-token:${DEPLOY_TOKEN}@github.com/${REPOSITORY}.git" gh-pages
